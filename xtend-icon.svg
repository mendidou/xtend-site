<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="sq">
      <rect x="0" y="0" width="1024" height="1024" rx="229" ry="229"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5AB5FF"/>
      <stop offset="55%" stop-color="#1F7DE0"/>
      <stop offset="100%" stop-color="#0B4CB8"/>
    </linearGradient>
    <radialGradient id="bgg" cx="512" cy="358" r="819" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gridmask" cx="512" cy="512" r="666" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="white" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
    <mask id="gm">
      <rect width="1024" height="1024" fill="url(#gridmask)"/>
    </mask>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#sq)">
    <!-- Background -->
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- Grid -->
    <g mask="url(#gm)">
      <line x1="0" y1="64" x2="1024" y2="64" stroke="white" stroke-width="1"/>
      <line x1="64" y1="0" x2="64" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="0" y1="128" x2="1024" y2="128" stroke="white" stroke-width="1"/>
      <line x1="128" y1="0" x2="128" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="0" y1="192" x2="1024" y2="192" stroke="white" stroke-width="1"/>
      <line x1="192" y1="0" x2="192" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="0" y1="256" x2="1024" y2="256" stroke="white" stroke-width="1"/>
      <line x1="256" y1="0" x2="256" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="0" y1="320" x2="1024" y2="320" stroke="white" stroke-width="1"/>
      <line x1="320" y1="0" x2="320" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="0" y1="384" x2="1024" y2="384" stroke="white" stroke-width="1"/>
      <line x1="384" y1="0" x2="384" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="0" y1="448" x2="1024" y2="448" stroke="white" stroke-width="1"/>
      <line x1="448" y1="0" x2="448" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="0" y1="512" x2="1024" y2="512" stroke="white" stroke-width="1"/>
      <line x1="512" y1="0" x2="512" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="0" y1="576" x2="1024" y2="576" stroke="white" stroke-width="1"/>
      <line x1="576" y1="0" x2="576" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="0" y1="640" x2="1024" y2="640" stroke="white" stroke-width="1"/>
      <line x1="640" y1="0" x2="640" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="0" y1="704" x2="1024" y2="704" stroke="white" stroke-width="1"/>
      <line x1="704" y1="0" x2="704" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="0" y1="768" x2="1024" y2="768" stroke="white" stroke-width="1"/>
      <line x1="768" y1="0" x2="768" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="0" y1="832" x2="1024" y2="832" stroke="white" stroke-width="1"/>
      <line x1="832" y1="0" x2="832" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="0" y1="896" x2="1024" y2="896" stroke="white" stroke-width="1"/>
      <line x1="896" y1="0" x2="896" y2="1024" stroke="white" stroke-width="1"/>
      <line x1="0" y1="960" x2="1024" y2="960" stroke="white" stroke-width="1"/>
      <line x1="960" y1="0" x2="960" y2="1024" stroke="white" stroke-width="1"/>
    </g>

    <!-- Glow -->
    <rect width="1024" height="1024" fill="url(#bgg)"/>

    <!-- A1 · Reaching X · one limb breaks free -->
    <line x1="220" y1="220" x2="804" y2="804" stroke="white" stroke-width="96" stroke-linecap="round"/>
    <line x1="804" y1="220" x2="160" y2="864" stroke="white" stroke-width="96" stroke-linecap="round" opacity="0.55"/>
    <line x1="512" y1="512" x2="940" y2="84" stroke="#FF6B6B" stroke-width="96" stroke-linecap="round"/>
    <circle cx="940" cy="84" r="26" fill="#FF6B6B"/>

    <!-- Gloss -->
    <rect width="1024" height="1024" fill="url(#gl)"/>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="1023" height="1023" rx="229" ry="229"
    fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>
</svg>
